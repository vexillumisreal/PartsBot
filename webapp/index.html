<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PartsBot Web App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <button id="btn-back" class="icon-btn" style="display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <h1 id="header-title">Каталог</h1>
            </div>
            <div class="header-actions">
                <button id="btn-cart" class="icon-btn cart-icon-btn" style="display: none;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span id="cart-badge" class="badge">0</span>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container" id="search-container">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="Поиск запчастей...">
                <button id="btn-clear-search" class="icon-btn clear-icon" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
        
        <!-- Breadcrumbs -->
        <div class="breadcrumbs" id="breadcrumbs" style="display: none;">
            <!-- Populated by JS -->
        </div>

        <!-- Category Filter Chips -->
        <div class="chips-container" id="category-chips" style="display: none;">
            <!-- Populated by JS -->
        </div>

        <!-- Main Content -->
        <main class="content">
            <!-- Catalog View -->
            <div id="view-catalog" class="view active">
                <div id="catalog-list" class="catalog-grid"></div>
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <span>Загрузка...</span>
                </div>
            </div>

            <!-- Cart View -->
            <div id="view-cart" class="view">
                <h2 class="section-title">Корзина</h2>
                <div id="cart-items" class="cart-list"></div>
                
                <div class="checkout-form glass-panel">
                    <h3 class="section-title">Оформление заказа</h3>
                    
                    <div class="form-group">
                        <label>Способ получения</label>
                        <select id="delivery_method" class="modern-input">
                            <option value="pickup">Самовывоз (Казань)</option>
                            <option value="cdek">СДЭК</option>
                            <option value="courier">Курьер (по городу)</option>
                        </select>
                    </div>

                    <div class="form-group" id="delivery_address_wrapper" style="display:none;">
                        <label>Адрес доставки</label>
                        <input type="text" id="delivery_address" class="modern-input" placeholder="Город, улица, дом...">
                    </div>

                    <div class="form-group">
                        <label>Контактный телефон</label>
                        <input type="tel" id="contact" class="modern-input" placeholder="+7 (999) 000-00-00">
                    </div>

                    <div class="form-group">
                        <label>Способ оплаты</label>
                        <select id="payment_method" class="modern-input">
                            <option value="cash">При получении</option>
                            <option value="sbp">Перевод СБП</option>
                            <option value="invoice">Счет (для юр.лиц)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Комментарий</label>
                        <textarea id="notes" class="modern-input" placeholder="Дополнительная информация..."></textarea>
                    </div>
                </div>

                <div class="cart-summary glass-panel">
                    <span>Итого:</span>
                    <strong id="cart-total" class="total-price">0 ₽</strong>
                </div>
            </div>
            
            <!-- Order Success View -->
            <div id="view-success" class="view">
                <div class="success-message glass-panel">
                    <div class="success-icon-wrapper">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                    <h2>Заказ успешно оформлен!</h2>
                    <p>Номер заказа: <strong id="success-order-id" class="order-id-badge"></strong></p>
                    <p class="success-hint">Чек и реквизиты отправлены вам в чат бота. Менеджер уже обрабатывает ваш заказ!</p>
                    <div class="success-actions">
                        <button id="btn-success-catalog" class="modern-btn primary-btn">📦 В каталог</button>
                        <button id="btn-success-close" class="modern-btn secondary-btn">Закрыть окно</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
